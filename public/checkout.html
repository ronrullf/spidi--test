<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirigiendo a Skylink Pay...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0f172a; color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    .loader-box { background: #1e293b; border-radius: 20px; padding: 36px 28px; max-width: 440px; width: 100%; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .spinner { width: 50px; height: 50px; border: 4px solid #334155; border-top-color: #0047FF; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 19px; margin-bottom: 8px; color: #fff; }
    p { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
    a.btn-direct { display: inline-block; background: #0047FF; color: white; padding: 12px 24px; border-radius: 10px; font-weight: 700; text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>
  <div class="loader-box">
    <div class="spinner"></div>
    <h2>Conectando con Skylink Pay</h2>
    <p>Redirigiendo a la pasarela oficial de pago seguro...</p>
    <a id="btnFallback" href="#" class="btn-direct">Continuar a Skylink Pay →</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('order_id') || params.get('ref') || '';

    async function redirectSkylink() {
      if (!orderId) {
        document.querySelector('p').textContent = 'No se especificó orden de pago.';
        return;
      }

      try {
        const res = await fetch(`/api/order-status/${encodeURIComponent(orderId)}`);
        const json = await res.json();
        if (json.success && json.data) {
          const skylinkUrl = json.data.skylinkUrl || json.data.paymentUrl || `https://dev-axis-payment.valinkgroup.com/pay/${json.data.token}`;
          document.getElementById('btnFallback').href = skylinkUrl;
          window.location.replace(skylinkUrl);
        } else {
          document.querySelector('p').textContent = 'Orden no encontrada o expirada.';
        }
      } catch (e) {
        document.querySelector('p').textContent = 'Error al conectar con la orden.';
      }
    }

    redirectSkylink();
  </script>
</body>
</html>
